<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HyoJoy</title>
<style>
:root {
    --bg: #1a1a1a; --bg-panel: #2a2a2a; --bg-input: #1f1f1f;
    --bg-input-focus: #242424; --bg-hover: #3a3a3a; --bg-active: #4a4a4a;
    --border: #3a3a3a; --border-hover: #555555;
    --text: #e0e0e0; --text-dim: #999999; --text-strong: #ffffff; --text-muted: #888888;
    --danger: #cc8888; --danger-bg: #3a1f1f; --danger-border: #553333;
    --success: #88cc88; --success-bg: #1f3a1f; --success-border: #335533;
}
* { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

/* Шапка */
.header {
    background: var(--bg-panel); border-bottom: 1px solid var(--border);
    padding: 14px 30px;
    display: flex; justify-content: space-between; align-items: center;
    position: relative;
}
.logo {
    color: var(--text-strong); font-size: 18px; letter-spacing: 3px;
    text-transform: uppercase; font-weight: bold;
}
.nav { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
.nav-btn {
    background: none; border: none; color: var(--text-dim);
    font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
    cursor: pointer; transition: 0.2s; padding: 8px 4px;
}
.nav-btn:hover { color: var(--text-strong); }
.nav-btn.active { color: var(--text-strong); border-bottom: 2px solid var(--border-hover); }

.avatar-wrap { position: relative; }
.avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--bg-active); border: 1px solid var(--border-hover);
    color: var(--text-strong); font-size: 16px; font-weight: bold;
    display: flex; justify-content: center; align-items: center;
    cursor: pointer; text-transform: uppercase;
    user-select: none;
    overflow: hidden;
}
.avatar:hover { background: var(--bg-hover); }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

.dropdown {
    position: absolute; top: 54px; right: 0;
    background: var(--bg-panel); border: 1px solid var(--border);
    min-width: 220px;
    display: none; flex-direction: column; z-index: 10;
}
.dropdown.open { display: flex; }
.dropdown-item {
    background: none; border: none; text-align: left;
    padding: 14px 18px; color: var(--text);
    font-size: 13px; letter-spacing: 1px; text-transform: uppercase;
    cursor: pointer; transition: 0.15s;
    border-bottom: 1px solid var(--border);
}
.dropdown-item:last-child { border-bottom: none; color: var(--danger); }
.dropdown-item:hover { background: var(--bg-hover); color: var(--text-strong); }
.dropdown-item:last-child:hover { background: var(--danger-bg); }

/* Основной контент */
.main {
    flex: 1;
    padding: 60px 40px;
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
}

/* Приветствие */
.hero {
    margin-bottom: 50px;
}
.hero h1 {
    font-size: 42px;
    font-weight: 300;
    letter-spacing: -0.5px;
    color: var(--text-strong);
    margin-bottom: 8px;
}
.hero p {
    color: var(--text-muted);
    font-size: 14px;
    letter-spacing: 1px;
}

/* О компании */
.company-section {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-left: 4px solid var(--success);
    padding: 28px 32px;
    margin-bottom: 40px;
}
.company-section h2 {
    font-size: 20px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-strong);
    margin-bottom: 18px;
    font-weight: 400;
}
.company-section p {
    color: var(--text);
    font-size: 15px;
    line-height: 1.8;
    white-space: pre-wrap;
    word-wrap: break-word;
}

/* Скачать игру */
.downloads-section {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    padding: 28px 32px;
}
.downloads-section h2 {
    font-size: 20px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-strong);
    margin-bottom: 6px;
    font-weight: 400;
}
.downloads-section .sub {
    color: var(--text-muted);
    font-size: 13px;
    letter-spacing: 1px;
    margin-bottom: 24px;
}

.downloads-list { display: flex; flex-direction: column; gap: 10px; }

.download-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 20px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    transition: 0.15s;
}
.download-item:hover { border-color: var(--border-hover); background: var(--bg-hover); }

.download-icon {
    width: 44px; height: 44px;
    background: var(--bg-active);
    border: 1px solid var(--border-hover);
    display: flex; justify-content: center; align-items: center;
    font-size: 22px;
    color: var(--success);
    flex-shrink: 0;
}
.download-info { flex: 1; min-width: 0; }
.download-title { color: var(--text-strong); font-size: 15px; font-weight: bold; }
.download-desc { color: var(--text-muted); font-size: 12px; margin-top: 3px; }
.download-size {
    color: var(--text-muted); font-size: 11px;
    font-family: monospace;
    margin-right: 12px;
    flex-shrink: 0;
}
.download-btn {
    background: var(--success-bg);
    border: 1px solid var(--success-border);
    color: var(--success);
    padding: 10px 20px;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: 0.15s;
    font-family: Arial, sans-serif;
    flex-shrink: 0;
    font-weight: bold;
}
.download-btn:hover { background: #2a4a2a; color: #aaffaa; }
.empty-downloads {
    padding: 40px 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

@media (max-width: 700px) {
    .main { padding: 30px 20px; }
    .hero h1 { font-size: 28px; }
    .company-section, .downloads-section { padding: 20px; }
    .download-item { flex-wrap: wrap; }
    .download-size { display: none; }
    .download-btn { width: 100%; }
}
</style>
</head>
<body>

<div class="header">
    <div class="logo">HyoJoy</div>

    <div class="nav">
        <button class="nav-btn active">Главная</button>
        <button class="nav-btn" onclick="location.href='store.html'">Магазин</button>
        <button class="nav-btn" onclick="location.href='users.html'">Аккаунты</button>
        <button class="nav-btn" onclick="location.href='forum.html'">Форум</button>
        <button class="nav-btn" onclick="location.href='company.html'">Компания</button>
        <button class="nav-btn" onclick="location.href='invest.html'">Инвестиции</button>
        <button class="nav-btn" onclick="location.href='cart.html'">Корзина (<span id="cart-count">0</span>)</button>

        <div class="avatar-wrap">
            <div class="avatar" id="avatar">?</div>
            <div class="dropdown" id="dropdown">
                <button class="dropdown-item" onclick="location.href='account.html'">Редактор аккаунта</button>
                <button class="dropdown-item" onclick="location.href='settings.html'">Настройки</button>
                <button class="dropdown-item" id="logout-btn">Выйти с аккаунта</button>
            </div>
        </div>
    </div>
</div>

<div class="main">
    <div class="hero">
        <h1>Добро пожаловать в HyoJoy</h1>
        <p>Выберите раздел в меню сверху</p>
    </div>

    <div class="company-section">
        <h2 id="company-title">HyoJoy Corporation</h2>
        <p id="company-desc">Загрузка описания...</p>
    </div>

    <div class="downloads-section">
        <h2>Скачать нашу игру</h2>
        <p class="sub">Выбери файл и играй — зарабатывай акции компании</p>
        <div id="downloads-list" class="downloads-list">
            <div class="empty-downloads">Загрузка...</div>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCUSTTJhonzZPOKWUbe_qMZfMmVyFSxjPE",
    authDomain: "hyojoy-41840.firebaseapp.com",
    projectId: "hyojoy-41840",
    storageBucket: "hyojoy-41840.firebasestorage.app",
    messagingSenderId: "714253431446",
    appId: "1:714253431446:web:fe08e2cbe51c768dfd48b7",
    measurementId: "G-DQ3F2VMTCJ"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let allFilesCache = {};

// Счётчик корзины
try {
    const cart = JSON.parse(localStorage.getItem('hyojoy_cart') || '{}');
    document.getElementById('cart-count').textContent =
        Object.values(cart).reduce((a, b) => a + b, 0);
} catch (e) {}

// ===== Компания =====
async function loadCompany() {
    try {
        const snap = await getDoc(doc(db, 'config', 'main'));
        if (snap.exists()) {
            const d = snap.data();
            document.getElementById('company-title').textContent =
                d.companyTitle || 'HyoJoy Corporation';
            document.getElementById('company-desc').textContent =
                d.companyDescription || 'Описание компании пока не заполнено.';
        }
    } catch (e) {
        console.error(e);
    }
}

// ===== Файлы для скачивания =====
async function loadDownloads() {
    const box = document.getElementById('downloads-list');
    try {
        const snap = await getDocs(collection(db, 'downloads'));
        if (snap.empty) {
            box.innerHTML = '<div class="empty-downloads">Файлов пока нет</div>';
            return;
        }
        const files = [];
        snap.forEach((d) => files.push({ id: d.id, ...d.data() }));
        files.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

        allFilesCache = {};
        files.forEach((f) => allFilesCache[f.id] = f);

        box.innerHTML = files.map((f) => {
            const sizeKB = f.size ? Math.round(f.size / 1024) + ' КБ' : '—';
            return `
                <div class="download-item">
                    <div class="download-icon">💾</div>
                    <div class="download-info">
                        <div class="download-title">${escapeHtml(f.title || 'Файл')}</div>
                        <div class="download-desc">${escapeHtml(f.description || '')}</div>
                    </div>
                    <div class="download-size">${sizeKB}</div>
                    <button class="download-btn" data-id="${f.id}">Скачать</button>
                </div>
            `;
        }).join('');

        box.querySelectorAll('.download-btn').forEach((btn) => {
            btn.addEventListener('click', () => downloadFile(btn.dataset.id));
        });
    } catch (e) {
        console.error(e);
        box.innerHTML = '<div class="empty-downloads">Ошибка загрузки</div>';
    }
}

function downloadFile(id) {
    const f = allFilesCache[id];
    if (!f || !f.data) return;

    const byteChars = atob(f.data);
    const bytes = new Uint8Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) bytes[i] = byteChars.charCodeAt(i);
    const blob = new Blob([bytes], { type: 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = f.filename || (f.title + '.exe');
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

function escapeHtml(s) {
    return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

// ===== Авторизация =====
let redirected = false;

onAuthStateChanged(auth, async (user) => {
    if (redirected) return;

    if (!user) {
        redirected = true;
        window.location.href = 'auth.html';
        return;
    }

    const nick = user.displayName || user.email.split('@')[0];
    const avatarEl = document.getElementById('avatar');
    avatarEl.textContent = nick.charAt(0).toUpperCase();

    try {
        const snap = await getDoc(doc(db, 'users', user.uid));
        const data = snap.exists() ? snap.data() : {};
        if (data.avatar) {
            avatarEl.innerHTML = `<img src="${data.avatar}" alt="avatar">`;
        }
        if (data.nickColor) {
            avatarEl.style.borderColor = data.nickColor;
            avatarEl.style.boxShadow = `0 0 0 2px ${data.nickColor}33`;
        }
        if (data.verified) {
            avatarEl.style.position = 'relative';
            const badge = document.createElement('span');
            badge.innerHTML = `<svg viewBox="0 0 24 24" fill="#a0c4ff" xmlns="http://www.w3.org/2000/svg" style="width:14px;height:14px;">
                <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
            </svg>`;
            badge.style.cssText = 'position:absolute;bottom:-2px;right:-2px;background:#1a1a1a;border-radius:50%;padding:2px;display:flex;';
            avatarEl.appendChild(badge);
        }
    } catch (e) {
        console.error('avatar load error:', e);
    }
});

// Аватарка — клик
document.getElementById('avatar').addEventListener('click', (e) => {
    e.stopPropagation();
    document.getElementById('dropdown').classList.toggle('open');
});
document.addEventListener('click', () => {
    document.getElementById('dropdown').classList.remove('open');
});
document.getElementById('logout-btn').addEventListener('click', async (e) => {
    e.stopPropagation();
    await signOut(auth);
    window.location.href = 'auth.html';
});

// ===== Загрузка при старте =====
loadCompany();
loadDownloads();
</script>
</body>
</html>
