<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Редактор аккаунта — HyoJoy</title>
<link rel="stylesheet" href="account.css">
</head>
<body>

<div class="header">
    <div class="logo" onclick="location.href='index.html'">HyoJoy</div>
    <div class="header-right">
        <button class="back-btn" onclick="location.href='profile.html'">Мой профиль</button>
        <button class="back-btn" onclick="location.href='index.html'">Главная</button>
    </div>
</div>

<div class="main">
    <div class="panel">
        <h1>Редактор аккаунта</h1>

        <!-- ЮЗЕРНЕЙМ -->
        <div class="section">
            <h2>Юзернейм</h2>
            <div class="input-group">
                <label>Юзернейм (латиница, цифры, _)</label>
                <div class="username-row">
                    <span class="username-at">@</span>
                    <input type="text" id="username-input" maxlength="30" placeholder="username" autocomplete="off">
                </div>
                <div class="username-hint" id="username-hint">3–30 символов, латиница, цифры, _</div>
            </div>
            <button class="btn" id="username-save-btn">Сохранить юзернейм</button>
            <div class="message" id="username-msg"></div>
        </div>

        <!-- АВАТАР -->
        <div class="section">
            <h2>Аватар</h2>
            <div class="avatar-block">
                <div class="avatar-preview" id="avatar-preview">?</div>
                <div class="avatar-actions">
                    <button id="pick-avatar-btn">Загрузить фото</button>
                    <button id="save-avatar-btn" style="display:none;">Сохранить аватар</button>
                    <button id="remove-avatar-btn" class="danger" style="display:none;">Удалить аватар</button>
                    <input type="file" id="avatar-input" accept="image/*">
                </div>
            </div>
            <div class="message" id="avatar-msg"></div>
        </div>

        <!-- НИК И ПАРОЛЬ -->
        <div class="section">
            <h2>Ник и пароль</h2>
            <div class="input-group">
                <label>Ник</label>
                <input type="text" id="new-nick" placeholder="Введите ник">
            </div>
            <div class="input-group">
                <label>Пароль для подтверждения (нужен для смены ника)</label>
                <input type="password" id="nick-pass" placeholder="Ваш текущий пароль">
            </div>
            <button class="btn" id="nick-btn">Сменить ник</button>
            <div class="message" id="nick-msg"></div>

            <div class="divider"></div>

            <div class="input-group">
                <label>Текущий пароль</label>
                <input type="password" id="old-pass" placeholder="Введите текущий пароль">
            </div>
            <div class="input-group">
                <label>Новый пароль</label>
                <input type="password" id="new-pass" placeholder="Минимум 6 символов">
            </div>
            <div class="input-group">
                <label>Повторите новый пароль</label>
                <input type="password" id="new-pass2" placeholder="Повторите новый пароль">
            </div>
            <button class="btn" id="pass-btn">Сменить пароль</button>
            <div class="message" id="pass-msg"></div>
        </div>

        <!-- ПРОФИЛЬ -->
        <div class="section">
            <h2>Профиль</h2>

            <div class="input-group">
                <label>Кастомный статус</label>
                <input type="text" id="edit-custom-status" maxlength="50" placeholder="Играю, Смотрю стрим...">
            </div>
            <div class="input-group">
                <label>Био (до 200 символов)</label>
                <textarea id="edit-bio" rows="4" maxlength="200" placeholder="О себе..."></textarea>
            </div>
            <div class="input-group">
                <label>Локация</label>
                <input type="text" id="edit-location" maxlength="60" placeholder="Москва, Россия">
            </div>
            <div class="input-group">
                <label>Дата рождения</label>
                <input type="date" id="edit-birthday">
            </div>
            <div class="input-group">
                <label>Любимые игры (через запятую)</label>
                <input type="text" id="edit-games" placeholder="Minecraft, CS2, Dota 2">
            </div>
            <div class="input-group">
                <label>Любимые фильмы (через запятую)</label>
                <input type="text" id="edit-movies" placeholder="Inception, Matrix">
            </div>
        </div>

        <!-- ССЫЛКИ -->
        <div class="section">
            <h2>Ссылки</h2>
            <div class="input-group">
                <label>Свой сайт</label>
                <input type="text" id="edit-site" placeholder="https://example.com">
            </div>
            <div class="input-group">
                <label>Discord</label>
                <input type="text" id="edit-discord" maxlength="60" placeholder="username#0000">
            </div>
            <div class="input-group">
                <label>Telegram</label>
                <input type="text" id="edit-telegram" maxlength="60" placeholder="@username">
            </div>
            <button class="btn save-profile" id="save-profile-btn">Сохранить профиль</button>
            <div class="message" id="profile-msg"></div>
        </div>
    </div>
</div>

<script type="module" src="account.js"></script>
<script type="module" src="online.js"></script>
</body>
</html>
